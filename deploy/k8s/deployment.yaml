apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agent-api
  template:
    metadata:
      labels:
        app: agent-api
    spec:
      containers:
        - name: agent-api
          image: ghcr.io/REPLACE_ME/agentic-production:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_NAME
              value: gemini-2.5-flash
            - name: AUTH_MODE
              value: oidc
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: gemini-api-key
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
