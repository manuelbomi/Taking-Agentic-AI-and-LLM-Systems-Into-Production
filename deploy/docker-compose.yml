services:
  agent-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: local-only-password
    ports:
      - "5432:5432"
